# Publishes a release with bookorbitdashboard.koplugin.zip attached, which
# the plugin's updater downloads. Runs when a version tag (v1.2.3) is pushed,
# or by hand from the Actions tab ("Run workflow"), which tags the commit
# with the version in main.lua.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          version=$(grep -oP 'PLUGIN_VERSION = "\K[^"]+' bookorbitdashboard.koplugin/main.lua)
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "main.lua says $version but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Build the plugin zip
        run: |
          cp LICENSE NOTICE ADDITIONAL_TERMS.md bookorbitdashboard.koplugin/
          zip -r -X bookorbitdashboard.koplugin.zip bookorbitdashboard.koplugin

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" bookorbitdashboard.koplugin.zip \
            --target "$GITHUB_SHA" --title "Bookorbit Dashboard $TAG" --generate-notes
